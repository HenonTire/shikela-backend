version: '3.8'

x-app-environment: &app-environment
  DEBUG: "False"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
  DATABASE_URL: ${DATABASE_URL}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-5432}
  REDIS_URL: ${REDIS_URL}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
  EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-false}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@shikela.local}
  EMAIL_VERIFICATION_ENABLED: ${EMAIL_VERIFICATION_ENABLED:-true}
  EMAIL_VERIFICATION_REQUIRED_FOR_LOGIN: ${EMAIL_VERIFICATION_REQUIRED_FOR_LOGIN:-true}
  EMAIL_VERIFICATION_BACKEND_BASE_URL: ${EMAIL_VERIFICATION_BACKEND_BASE_URL:-}
  EMAIL_VERIFICATION_FRONTEND_URL: ${EMAIL_VERIFICATION_FRONTEND_URL:-}
  SANTIMPAY_TEST_BED: ${SANTIMPAY_TEST_BED:-false}
  SANTIMPAY_MERCHANT_ID: ${SANTIMPAY_MERCHANT_ID:-}
  SANTIMPAY_PRIVATE_KEY: ${SANTIMPAY_PRIVATE_KEY:-}
  SANTIMPAY_SIGN_TOKEN_URL: ${SANTIMPAY_SIGN_TOKEN_URL:-}
  SANTIMPAY_SUCCESS_REDIRECT_URL: ${SANTIMPAY_SUCCESS_REDIRECT_URL:-}
  SANTIMPAY_FAILURE_REDIRECT_URL: ${SANTIMPAY_FAILURE_REDIRECT_URL:-}
  SANTIMPAY_CANCEL_REDIRECT_URL: ${SANTIMPAY_CANCEL_REDIRECT_URL:-}
  SANTIMPAY_NOTIFY_URL: ${SANTIMPAY_NOTIFY_URL:-}
  PLATFORM_USER_ID: ${PLATFORM_USER_ID:-}
  PLATFORM_USER_EMAIL: ${PLATFORM_USER_EMAIL:-}
  PLATFORM_MERCHANT_ID: ${PLATFORM_MERCHANT_ID:-}
  FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
  FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
  FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}

services:
  web:
    image: shikela-backend:latest
    container_name: shikela_web_prod
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --access-logfile - --error-logfile -"
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  nginx:
    image: nginx:1.27-alpine
    container_name: shikela_nginx_prod
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    restart: always

  db:
    image: postgres:15
    container_name: shikela_db_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: shikela_redis_prod
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery:
    image: shikela-backend:latest
    container_name: shikela_celery_prod
    command: celery -A core worker -l info --concurrency=4
    env_file:
      - .env
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  celery-beat:
    image: shikela-backend:latest
    container_name: shikela_celery_beat_prod
    command: celery -A core beat -l info
    env_file:
      - .env
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
