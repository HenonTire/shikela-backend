

x-app-environment: &app-environment
  DEBUG: ${DEBUG:-False}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web,nginx}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
  DATABASE_URL: postgresql://${POSTGRES_USER:-shikela_user}:${POSTGRES_PASSWORD:-shikela_password}@db:5432/${POSTGRES_DB:-shikela_db}
  DB_HOST: db
  DB_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-false}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  EMAIL_VERIFICATION_ENABLED: ${EMAIL_VERIFICATION_ENABLED:-true}
  EMAIL_VERIFICATION_REQUIRED_FOR_LOGIN: ${EMAIL_VERIFICATION_REQUIRED_FOR_LOGIN:-true}
  EMAIL_VERIFICATION_BACKEND_BASE_URL: ${EMAIL_VERIFICATION_BACKEND_BASE_URL:-http://127.0.0.1:8000}
  EMAIL_VERIFICATION_FRONTEND_URL: ${EMAIL_VERIFICATION_FRONTEND_URL:-}
  SANTIMPAY_TEST_BED: ${SANTIMPAY_TEST_BED:-true}
  SANTIMPAY_MERCHANT_ID: ${SANTIMPAY_MERCHANT_ID:-}
  SANTIMPAY_PRIVATE_KEY: ${SANTIMPAY_PRIVATE_KEY:-}
  SANTIMPAY_SIGN_TOKEN_URL: ${SANTIMPAY_SIGN_TOKEN_URL:-}
  SANTIMPAY_SUCCESS_REDIRECT_URL: ${SANTIMPAY_SUCCESS_REDIRECT_URL:-http://127.0.0.1:8000/payment/success}
  SANTIMPAY_FAILURE_REDIRECT_URL: ${SANTIMPAY_FAILURE_REDIRECT_URL:-http://127.0.0.1:8000/payment/failure}
  SANTIMPAY_CANCEL_REDIRECT_URL: ${SANTIMPAY_CANCEL_REDIRECT_URL:-http://127.0.0.1:8000/payment/cancel}
  SANTIMPAY_NOTIFY_URL: ${SANTIMPAY_NOTIFY_URL:-http://127.0.0.1:8000/payment/webhook/santimpay/}
  PLATFORM_USER_ID: ${PLATFORM_USER_ID:-}
  PLATFORM_USER_EMAIL: ${PLATFORM_USER_EMAIL:-}
  PLATFORM_MERCHANT_ID: ${PLATFORM_MERCHANT_ID:-}
  FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
  FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
  FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}

services:
  db:
    image: postgres:15
    container_name: shikela_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shikela_db}
      POSTGRES_USER: ${POSTGRES_USER:-shikela_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shikela_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shikela_user} -d ${POSTGRES_DB:-shikela_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: shikela_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: shikela_web
    command: >
      sh -c "python manage.py migrate &&
            python manage.py collectstatic --noinput &&
            gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery:
    build: .
    container_name: shikela_celery
    command: celery -A core worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  celery-beat:
    build: .
    container_name: shikela_celery_beat
    command: celery -A core beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: shikela_nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    profiles:
      - nginx

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
